services:
  - type: web
    name: vkusvill-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://ai.api.cloud.yandex.net/v1
      - key: MODEL_NAME
        sync: false
      - key: MCP_URL
        value: https://mcp.vkusvill.ru/mcp
